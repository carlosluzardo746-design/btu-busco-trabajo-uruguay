---
deployment:
  tasks:
    - export DEPLOYPATH=/home/buscotra/public_html/
    - /bin/cp -R hosting-app/index.html $DEPLOYPATH
    - /bin/cp -R hosting-app/index.html $DEPLOYPATH/btu-home.html
    - /bin/cp -R hosting-app/index.php $DEPLOYPATH
    - /bin/cp -R hosting-app/styles.css $DEPLOYPATH
    - /bin/cp -R hosting-app/app-hosting.js $DEPLOYPATH
    - /bin/cp -R hosting-app/api.php $DEPLOYPATH
    - /bin/cp -R hosting-app/robots.txt $DEPLOYPATH
    - /bin/cp -R hosting-app/sitemap.xml $DEPLOYPATH
    - /bin/cp -R hosting-app/setup.php $DEPLOYPATH
    - /bin/cp -R hosting-app/install.sql $DEPLOYPATH
    - /bin/cp -R hosting-app/config.example.php $DEPLOYPATH
    - /bin/cp -R hosting-app/.htaccess $DEPLOYPATH
    - /bin/mkdir -p $DEPLOYPATH/assets
    - /bin/cp -R hosting-app/assets/btu-logo.jpeg $DEPLOYPATH/assets/btu-logo.jpeg
    - /bin/cp -R hosting-app/assets/uruwork-logo.png $DEPLOYPATH/assets/uruwork-logo.png
    - /bin/mkdir -p $DEPLOYPATH/uploads
    - /bin/cp -R hosting-app/uploads/.htaccess $DEPLOYPATH/uploads/.htaccess
    - export URUWORKPATH=/home/buscotra/public_html/uruwork/
    - /bin/mkdir -p $URUWORKPATH
    - /bin/cp -R uruwork-site/index.html $URUWORKPATH
    - /bin/cp -R uruwork-site/styles.css $URUWORKPATH
    - /bin/cp -R uruwork-site/robots.txt $URUWORKPATH
    - /bin/cp -R uruwork-site/sitemap.xml $URUWORKPATH
    - /bin/cp -R uruwork-site/.htaccess $URUWORKPATH
    - /bin/mkdir -p $URUWORKPATH/assets
    - /bin/cp -R uruwork-site/assets/uruwork-logo.png $URUWORKPATH/assets/uruwork-logo.png
